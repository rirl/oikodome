[project]
name = "kios"
version = "0.1.0"
description = "Knowledge Investigation Operation System"
readme = "README.adoc"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
kios = "kios.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
